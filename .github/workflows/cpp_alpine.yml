name: C++ workflow on Alpine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Install Git
        run: |
          apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            cmake \
            linux-headers \
            openssl-dev \
            zlib-dev \
            zstd-dev \
            lz4-dev

      - name: Configure
        run: |
          cmake \
            -S cpp \
            -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build cpp/build \
            --parallel 1
