name: C++ workflow on FreeBSD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-freebsd:
    strategy:
      matrix:
        connector:
          - system
          - submodule

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          run: |
            pkg update

            pkg install -y \
              cmake \
              gcc \
              gmake \
              mysql84-client

            if [ "${{ matrix.connector }}" = "system" ]; then
              pkg search mysql | grep -i connector || true
            else
              pkg install -y \
                boost-libs \
                liblz4 \
                protobuf \
                zstd \
                libunwind
            fi

            rm -rf cpp/build
            rm -rf cpp/mysql-connector-cpp/build

            cmake \
              -S cpp \
              -B cpp/build \
              -DCMAKE_BUILD_TYPE=Release

            cmake \
              --build cpp/build \
              --parallel 2
