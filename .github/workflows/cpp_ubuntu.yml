name: C++ workflow on Ubuntu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            libprotobuf-dev \
            protobuf-compiler \
            liblz4-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Clean Connector/C++ build
        run: |
          rm -rf cpp/mysql-connector-cpp/build

      - name: Configure
        run: |
          cmake \
            -S cpp \
            -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build cpp/build \
            --parallel
